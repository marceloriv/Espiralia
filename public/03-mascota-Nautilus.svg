<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
<title id="title">Nautilus — mascota de Espiralia</title>
<desc id="desc">Nautilus amistoso hecho con papel plegado marfil y magenta, caparazón en espiral, ojo cerrado y tentáculos de origami.</desc>
<defs>
 <linearGradient id="mag" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#CE4B8E"/><stop offset="1" stop-color="#961C5C"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF1DF"/><stop offset="1" stop-color="#EED0AD"/></linearGradient>
</defs>
