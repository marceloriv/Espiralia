<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages no permite cabeceras, así que el CSP va como meta. style-src admite 'unsafe-inline' porque los componentes usan atributos style; no hay scripts en línea. frame-ancestors no funciona en meta. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1817" media="(prefers-color-scheme: dark)" />
    <script src="/theme-init.js"></script>
    <meta name="description" content="Espiralia es un cuaderno de productividad personal en el navegador: agenda, planner, tareas y notas por perfil, sin cuenta y sin servidor." />
    <title>Espiralia</title>
    <!-- Las cinco fuentes se usan en la primera pantalla; precargarlas evita que el cambio de fuente mueva el diseño (CLS). -->
    <link rel="preload" href="/src/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/playball-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/spline-sans-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/reenie-beanie-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      .hero { display: flex; flex-direction: column; gap: 8px; }
      .heroTitle { margin: 0; line-height: 1.15; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
