services:
  sonarqube-db:
    image: postgres:15-alpine
    container_name: espiralia-sonarqube-db
    profiles:
      - tools
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonarpassword}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
    volumes:
      - sonarqube_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - espiralia-network

  sonarqube:
    image: sonarqube:community
    container_name: espiralia-sonarqube
    profiles:
      - tools
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonarpassword}
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonar}
    depends_on:
      sonarqube-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - espiralia-network
    restart: unless-stopped

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: espiralia-scanner
    profiles:
      - tools
    env_file:
      - path: .env
        required: false
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      SONAR_SCANNER_OPTS: "-Xmx1024m"
    volumes:
      - ./:/usr/src
    depends_on:
      sonarqube:
        condition: service_healthy
    networks:
      - espiralia-network

volumes:
  sonarqube_pgdata:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  espiralia-network:
    driver: bridge
    name: espiralia-network
