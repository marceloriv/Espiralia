# ==============================================================================
# Configuración SonarQube — Espiralia
# ==============================================================================
sonar.projectKey=espiralia
sonar.projectName=Espiralia
sonar.projectVersion=0.4.0
sonar.sourceEncoding=UTF-8

# Limitar memoria RAM asignada al proceso Node.js embebido (sensor JS/TS) para evitar OOM
sonar.javascript.node.maxspace=512

# Rutas de código fuente y tests
sonar.sources=src
sonar.tests=src/tests

# Exclusiones
sonar.exclusions=**/.git/**,**/node_modules/**,**/dist/**,**/.scannerwork/**,**/coverage/**,**/*.test.tsx,**/*.test.ts
sonar.test.inclusions=src/tests/**

# Reporte de cobertura (LCOV generado por Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
